spring:
  application:
    name: event-manager

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eventdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  cassandra:
    contact-points: ${CASSANDRA_HOST:localhost}
    port: ${CASSANDRA_PORT:9042}
    keyspace-name: ${CASSANDRA_KEYSPACE:event_manager}
    local-datacenter: ${CASSANDRA_DATACENTER:datacenter1}
    schema-action: create_if_not_exists

  cache:
    type: redis
    redis:
      time-to-live: 3600000

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: event-manager-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.eventmanager.kafka
        spring.json.value.default.type: com.eventmanager.kafka.VideoEvent
    listener:
      ack-mode: manual

jwt:
  secret: ${JWT_SECRET:3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  window-duration: ${RATE_LIMIT_WINDOW_DURATION:1s}
  max-requests: ${RATE_LIMIT_MAX_REQUESTS:1000}

edge-metrics:
  enabled: ${EDGE_METRICS_ENABLED:true}

# gRPC client config for the external payment service called synchronously from
# TicketService.purchaseTicket — see docs/payment-service-integration.md.
payment-service:
  host: ${PAYMENT_SERVICE_HOST:localhost}
  port: ${PAYMENT_SERVICE_PORT:9095}
  deadline: ${PAYMENT_SERVICE_DEADLINE:120s}
  connect-timeout: ${PAYMENT_SERVICE_CONNECT_TIMEOUT:5s}

# This application's own gRPC server (distinct from the payment-service client above) — see
# docs/grpc-api-exposure.md and payment-service-grpc.md.
grpc-api:
  enabled: ${GRPC_API_ENABLED:true}
  port: ${GRPC_API_PORT:9091}
  # Plaintext by default. grpc-java wants a PEM cert chain + PEM private key (not a PKCS12/JKS
  # keystore, so this is a different shape from server.ssl.* below) — see certs/README.md to
  # generate a matching local dev cert.
  tls:
    enabled: ${GRPC_API_TLS_ENABLED:false}
    cert-chain-file: ${GRPC_API_TLS_CERT_CHAIN_FILE:}
    private-key-file: ${GRPC_API_TLS_PRIVATE_KEY_FILE:}

oauth2:
  issuer: ${OAUTH2_ISSUER:http://localhost:8080}

server:
  port: 8080
  # Plaintext by default. Set to true with a real keystore to serve the REST API/web UI over
  # HTTPS — see certs/README.md to generate a matching local dev cert (PKCS12, not the PEM pair
  # grpc-api.tls.* above uses).
  ssl:
    enabled: ${SERVER_SSL_ENABLED:false}
    key-store: ${SERVER_SSL_KEY_STORE:}
    key-store-password: ${SERVER_SSL_KEY_STORE_PASSWORD:}
    key-store-type: ${SERVER_SSL_KEY_STORE_TYPE:PKCS12}
    key-alias: ${SERVER_SSL_KEY_ALIAS:}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
  info:
    env:
      enabled: true
    build:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99

info:
  app:
    name: "@project.name@"
    version: "@project.version@"
    description: "@project.description@"

logging:
  level:
    com.eventmanager: DEBUG
    org.springframework.security: INFO
