syntax = "proto3";

package eventmanager.api.v1;

option java_package = "com.eventmanager.grpc.api";
option java_outer_classname = "EventManagerApiProto";
option java_multiple_files = true;

import "google/protobuf/empty.proto";

// gRPC transport for this application's own API (events/tickets here; see venue_api.proto and
// performer_api.proto for venues/performers), alongside the REST API (/api/v1/**) and the
// Thymeleaf web UI (/ui/**) — all three call the same service layer (EventService,
// TicketService, VenueService, PerformerService). See docs/grpc-api-exposure.md and
// payment-service-grpc.md (a separate, unrelated gRPC client this application makes *to* an
// external payment service).
//
// Auth: send a custom JWT (the same one POST /api/v1/auth/login returns) as gRPC metadata
// "authorization: Bearer <token>". Public RPCs work with no token and return the same data
// regardless of role; authenticated-only RPCs return UNAUTHENTICATED with no token;
// ADMIN-only RPCs (CreateEvent, UpdateEvent, DeleteEvent here; the Create/Update/Delete/
// AddVideo/RemoveVideo RPCs in venue_api.proto/performer_api.proto) return PERMISSION_DENIED for
// an authenticated caller without ROLE_ADMIN.
service EventGrpcService {
  rpc GetEvent(GetEventRequest) returns (EventMessage);
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  rpc GetAvailableTicketCount(GetEventRequest) returns (AvailableTicketCountResponse);
  rpc CreateEvent(CreateEventRequest) returns (EventMessage);   // ADMIN
  rpc UpdateEvent(UpdateEventRequest) returns (EventMessage);   // ADMIN
  rpc DeleteEvent(EventIdRequest) returns (google.protobuf.Empty); // ADMIN
}

service TicketGrpcService {
  rpc GetTicket(GetTicketRequest) returns (TicketMessage);
  rpc GetMyTickets(PageQuery) returns (TicketPageResponse);
  // The caller's purchases, declined payments, and cancellations, newest first.
  rpc GetMyTicketTransactions(PageQuery) returns (TicketTransactionPageResponse);
  rpc ReserveTicket(TicketIdRequest) returns (TicketMessage);
  // Reserves the next AVAILABLE ticket for the event (EventIdRequest.id); FAILED_PRECONDITION if
  // none are left, NOT_FOUND if the event doesn't exist.
  rpc ReserveAvailableTicket(EventIdRequest) returns (TicketMessage);
  rpc ReleaseTicket(TicketIdRequest) returns (TicketMessage);
  rpc PurchaseTicket(PurchaseTicketGrpcRequest) returns (TicketMessage);
  rpc CancelTicket(TicketIdRequest) returns (TicketMessage);
}

message GetEventRequest {
  int64 id = 1;
}

message EventIdRequest {
  int64 id = 1;
}

// Every field is optional and the ones given are ANDed, same as GET /api/v1/events. With none
// set, returns all events.
message ListEventsRequest {
  optional int64 venue_id = 1;
  optional int64 performer_id = 2;
  optional string start = 3; // inclusive lower bound, ISO-8601 local date-time, e.g. "2026-06-01T00:00:00"
  optional string end = 4;   // inclusive upper bound, same format
}

message ListEventsResponse {
  repeated EventMessage events = 1;
}

message AvailableTicketCountResponse {
  int64 count = 1;
}

message CreateEventRequest {
  string name = 1;
  string description = 2;
  string event_date = 3;    // ISO-8601, e.g. "2025-08-15T19:00:00"
  string ticket_price = 4;  // decimal as a string
  int32 tickets_total = 5;
  int64 venue_id = 6;
  repeated int64 performer_ids = 7;
}

message UpdateEventRequest {
  int64 id = 1;
  string name = 2;
  string description = 3;
  string event_date = 4;
  string ticket_price = 5;
  int64 venue_id = 6;
  repeated int64 performer_ids = 7;
  // tickets_total is deliberately not a field here: it's immutable after creation and
  // EventService.updateEvent already silently ignores it even when present in the REST
  // EventRequest body — this new surface simply doesn't offer a field that would be dropped.
}

message VenueMessage {
  int64 id = 1;
  string name = 2;
  string address = 3;
  string city = 4;
  string state = 5;
  optional string zip_code = 6;
  int32 capacity = 7;
}

message PerformerMessage {
  int64 id = 1;
  string name = 2;
  optional string genre = 3;
  optional string bio = 4;
  repeated string video_urls = 5;
}

message EventMessage {
  int64 id = 1;
  string name = 2;
  string description = 3;
  string event_date = 4;    // ISO-8601 (LocalDateTime.toString()), e.g. "2025-08-15T19:00"
  string ticket_price = 5;  // decimal as a string, as in the payment-service proto
  int32 tickets_total = 6;
  string status = 7;        // EventStatus name: AVAILABLE or DELETING
  VenueMessage venue = 8;
  repeated PerformerMessage performers = 9;
  string created_at = 10;
  string updated_at = 11;
}

message GetTicketRequest {
  int64 id = 1;
}

message TicketIdRequest {
  int64 id = 1;
}

message PurchaseTicketGrpcRequest {
  int64 id = 1;
  string payment_token = 2;           // tokenized payment-method reference, never raw card data
  optional string payment_request_id = 3;
}

message PerformerSummaryMessage {
  int64 id = 1;
  string name = 2;
}

message TicketMessage {
  int64 id = 1;
  int64 event_id = 2;
  string event_name = 3;
  string event_date = 4;
  string description = 5;
  int64 venue_id = 6;
  string venue_name = 7;
  repeated PerformerSummaryMessage performers = 8;
  string status = 9;  // TicketStatus name: AVAILABLE, RESERVED, PAYING, or SOLD
  optional int64 user_id = 10;
  optional string payment_request_id = 11;
  optional string date_purchased = 12;  // set only once a purchase has been APPROVED; never cleared by cancellation
}

// Mirrors TicketTransactionResponse; the idempotency token is deliberately never exposed.
message TicketTransactionMessage {
  int64 id = 1;
  int64 ticket_id = 2;
  int64 event_id = 3;
  string event_name = 4;
  string operation = 5;               // PURCHASE, PAYMENT_DECLINED, or CANCEL
  string purchase_price = 6;          // decimal as a string, like ticket_price
  string payment_service = 7;
  string payment_confirmation_details = 8;
  optional string payment_request_id = 9;
  string operation_date = 10;         // ISO-8601 with UTC offset, e.g. "2026-11-11T22:39:51.469951Z"
}

message TicketTransactionPageResponse {
  repeated TicketTransactionMessage content = 1;
  int32 page = 2;
  int32 size = 3;
  int64 total_elements = 4;
  int32 total_pages = 5;
  bool last = 6;
}

message PageQuery {
  int32 page = 1;
  int32 size = 2;
}

message TicketPageResponse {
  repeated TicketMessage content = 1;
  int32 page = 2;
  int32 size = 3;
  int64 total_elements = 4;
  int32 total_pages = 5;
  bool last = 6;
}
