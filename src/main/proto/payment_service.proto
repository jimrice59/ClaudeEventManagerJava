syntax = "proto3";

package eventmanager.payment.v1;

option java_package = "com.eventmanager.grpc.payment";
option java_outer_classname = "PaymentServiceProto";
option java_multiple_files = true;

// Contract for the external payment service this application calls synchronously from
// TicketService.purchaseTicket. See docs/payment-service-integration.md for the full design
// (saga-style two-transaction split, PAYING ticket status, Redis caching of the idempotency
// token and payment_request_id).
service PaymentService {
  // Attempts to charge the caller for a ticket. The caller (this application) generates
  // payment_request_id up front and passes it on every attempt, including retries after a
  // network-level failure — the payment service is expected to treat repeated calls with the
  // same payment_request_id as the same logical attempt (idempotent), not a second charge.
  rpc PurchaseTicket(PurchaseTicketRequest) returns (PaymentResponse);

  // Looks up the outcome of a previous PurchaseTicket call by payment_request_id. Used for
  // reconciliation when the original call's result was never learned (e.g. this application's
  // 120-second deadline was exceeded, or this application crashed mid-call) — see
  // docs/payment-service-integration.md, "Reconciling a stuck PAYING ticket".
  rpc GetPaymentStatus(GetPaymentStatusRequest) returns (PaymentResponse);
}

message PurchaseTicketRequest {
  // Caller-generated unique id for this purchase attempt (a UUID). Passed by the client that
  // called POST /api/v1/tickets/{id}/purchase if it supplied one, otherwise generated by
  // TicketService. Doubles as the idempotency key for retries and as the lookup key for
  // GetPaymentStatus.
  string payment_request_id = 1;

  int64 user_id = 2;

  // A tokenized reference to a previously-vaulted payment method (e.g. a Stripe/Square
  // payment-method token), never raw card data — this service never sees or stores PANs/CVVs.
  string payment_token = 3;

  int64 ticket_id = 4;

  // Decimal amount as a string (e.g. "99.99") to avoid floating-point representation issues;
  // always the ticket's event's server-side ticketPrice, never client-supplied.
  string purchase_price = 5;
}

message GetPaymentStatusRequest {
  string payment_request_id = 1;
}

message PaymentResponse {
  PaymentStatus status = 1;

  // Present only when status == APPROVED.
  string confirmation_id = 2;

  // Issued by the payment service for this payment_request_id; used by the caller to recover
  // the outcome if it crashes or times out after the charge actually succeeded, without the
  // risk of double-submitting PurchaseTicket again.
  string idempotency_token = 3;
}

enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  APPROVED = 1;
  DECLINED = 2;
  // Returned by GetPaymentStatus while a PurchaseTicket call is still being processed.
  PENDING = 3;
}
