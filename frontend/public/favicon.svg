<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
 <!-- teal tile so the cream snout doesn't wash out against light browser tabs -->
 <defs><radialGradient id="tile" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#1aa39a"/><stop offset="0.7" stop-color="#0f766e"/></radialGradient></defs>
 <rect width="120" height="120" rx="26" fill="url(#tile)"/>
 <g transform="rotate(-6 60 62)">
  <!-- far ear (narrower, behind) -->
  <path d="M30 50 L31 12 L55 32 Z" fill="#c2410c"/>
  <path d="M34 42 L35 21 L48 33 Z" fill="#431407"/>
  <!-- near ear -->
  <path d="M68 29 L97 9 L99 49 Z" fill="#c2410c"/>
  <path d="M75 30 L93 17 L94 42 Z" fill="#431407"/>
  <!-- head with cheek fluff on the near side -->
  <path d="M27 58 C26 38 44 26 64 26 C86 26 103 39 104 57 C104 63 102 68 99 72 L107 77 L97 80 L102 88 L91 88
           C83 99 70 105 57 105 C42 105 28 96 22 88 L6 75 C13 69 20 62 27 57 Z" fill="#ea580c"/>
  <!-- cream lower face: snout (left, rising to meet the nose) sweeping into the near cheek -->
  <path d="M7 76 C15 69 23 63 33 62 C45 63 55 70 61 79 C70 87 82 88 94 84 L91 88
           C83 99 70 105 57 106 C40 106 22 96 7 76 Z" fill="#fff7ed"/>
  <!-- eyes: wide open on top and looking straight at you; cheeks lift the lower lids into
       "smiling eyes" (warm and self-assured, unlike sly lowered upper lids) -->
  <ellipse cx="42" cy="52" rx="5.8" ry="7.4" fill="#2b1d16"/>
  <ellipse cx="73" cy="51" rx="7.8" ry="9.4" fill="#2b1d16"/>
  <path d="M34.5 57.4 Q42 53.4 49.5 57.4 V62 H34.5 Z" fill="#ea580c"/>
  <path d="M63 56.6 Q73 51.8 83 56.6 V62.5 H63 Z" fill="#ea580c"/>
  <!-- a twinkle in each eye: four-point sparkles instead of plain round highlights -->
  <path d="M40.2 45.2 L41.1 48 L43.9 48.9 L41.1 49.8 L40.2 52.6 L39.3 49.8 L36.5 48.9 L39.3 48 Z" fill="#fff"/>
  <path d="M70.4 42.6 L71.6 46.1 L75.1 47.3 L71.6 48.5 L70.4 52 L69.2 48.5 L65.7 47.3 L69.2 46.1 Z" fill="#fff"/>
  <circle cx="44.6" cy="53.2" r="0.9" fill="#fff" opacity="0.8"/>
  <circle cx="77" cy="52.4" r="1.2" fill="#fff" opacity="0.8"/>
  <!-- brows: both arched upward, the near one raised higher = curious, quick-witted -->
  <path d="M36 41.5 Q41.5 37.6 47.5 40" fill="none" stroke="#7c2d12" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M65.5 35.5 Q73 28.6 82 33.2" fill="none" stroke="#7c2d12" stroke-width="2.8" stroke-linecap="round"/>
  <!-- blush on near cheek -->
  <ellipse cx="84" cy="70" rx="6.5" ry="4.5" fill="#fb7185" opacity="0.45"/>
  <!-- confident, warm smile: open just enough to show a bit of tongue, both corners up -->
  <path d="M17 80 Q32 88 50 84.5 Q45 94.5 33.5 95 Q22 93.5 17 80 Z" fill="#7f1d1d"/>
  <path d="M24.5 90.5 Q31.5 96.6 40.5 92.8 Q33 88.4 24.5 90.5 Z" fill="#fb7185"/>
  <path d="M12.5 78.5 Q32 88.5 51 84" fill="none" stroke="#2b1d16" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M50.6 84.2 Q54.8 83.2 55.6 79.2" fill="none" stroke="#2b1d16" stroke-width="2.4" stroke-linecap="round"/>
  <!-- nose at the snout tip, drawn last so it sits on top -->
  <ellipse cx="9.5" cy="74.8" rx="5.2" ry="4.3" fill="#2b1d16" transform="rotate(-12 9.5 74.8)"/>
  <ellipse cx="8" cy="73.4" rx="1.8" ry="1.1" fill="#fff" opacity="0.75"/>
 </g>
</svg>
